# ---------------------------------------------------------------------------
# Production profile for the Ride Service.
# NO secrets are defined here on purpose: they MUST be supplied externally.
# ---------------------------------------------------------------------------

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

logging:
  level:
    root: INFO
    com.ridebooking.ride: INFO
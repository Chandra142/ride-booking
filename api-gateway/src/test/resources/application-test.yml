spring:
  cloud:
    discovery:
      client:
        enabled: false
    gateway:
      default-filters: []
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service-test
          uri: http://localhost:${wiremock.server.port:8089}
          predicates:
            - Path=/api/auth/**
        - id: user-service-test
          uri: http://localhost:${wiremock.server.port:8089}
          predicates:
            - Path=/api/v1/users/**
        - id: driver-service-test
          uri: http://localhost:${wiremock.server.port:8089}
          predicates:
            - Path=/api/v1/drivers/**
        - id: ride-service-test
          uri: http://localhost:${wiremock.server.port:8089}
          predicates:
            - Path=/api/rides/**
        - id: payment-service-test
          uri: http://localhost:${wiremock.server.port:8089}
          predicates:
            - Path=/api/v1/payments/**
            - Path=/api/v1/wallet/**
            - Path=/api/v1/invoices/**
        - id: notification-service-test
          uri: http://localhost:${wiremock.server.port:8089}
          predicates:
            - Path=/api/v1/notifications/**

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: test-secret-key-for-unit-tests-only-32-bytes!

gateway:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.ridebooking.gateway: WARN

resilience4j:
  circuitbreaker:
    instances:
      authService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      userService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      driverService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      rideService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      paymentService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      notificationService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      authService:
        timeoutDuration: 5s
      userService:
        timeoutDuration: 5s
      driverService:
        timeoutDuration: 5s
      rideService:
        timeoutDuration: 10s
      paymentService:
        timeoutDuration: 10s
      notificationService:
        timeoutDuration: 5s

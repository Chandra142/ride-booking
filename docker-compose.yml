# =====================================================================
# Ride Booking System - local infrastructure
# ---------------------------------------------------------------------
# Stage 2: PostgreSQL only. Redis / Kafka are added in later stages.
#
#   Start:   docker compose up -d postgres
#   Check:   docker compose ps
#   Logs:    docker compose logs postgres
#   Stop:    docker compose down        # data persists (named volume)
#   Wipe:    docker compose down -v     # DESTROYS local database data
#
# Java services run on the host (IDE/Maven) and connect to this
# container via DB_HOST=localhost:DB_PORT. The exposed host port must
# match DB_PORT used by the services. The DB is reachable from other
# Compose services as `postgres:5432` on the ride-booking-network.
# =====================================================================

name: ride-booking

services:
  postgres:
    image: postgres:17-alpine
    container_name: ride-booking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ride_booking

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first initialization (empty data volume).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - ride-booking-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ride_booking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: ride-booking-postgres-data

networks:
  ride-booking-network:
    name: ride-booking-network
    driver: bridge
# =====================================================================
# Ride Booking System - local infrastructure
# ---------------------------------------------------------------------
# Stage 3: PostgreSQL + Redis. Kafka / WebSockets are added in later stages.
#
#   Start:   docker compose up -d postgres redis
#   Check:   docker compose ps
#   Logs:    docker compose logs redis
#   Stop:    docker compose down        # data persists (named volumes)
#   Wipe:    docker compose down -v     # DESTROYS local database/redis data
#
# Java services run on the host (IDE/Maven) and connect to this
# container via DB_HOST/DB_PORT and REDIS_HOST/REDIS_PORT. The exposed
# host ports must match the values used by the services.
# PostgreSQL: DB_HOST=localhost / DB_PORT (DB_PORT defaults to 5432).
# Redis:      REDIS_HOST=localhost / REDIS_PORT (REDIS_PORT defaults to 6379).
# =====================================================================

name: ride-booking

services:
  postgres:
    image: postgres:17-alpine
    container_name: ride-booking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ride_booking

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first initialization (empty data volume).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - ride-booking-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ride_booking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ride-booking-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    networks:
      - ride-booking-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: ride-booking-postgres-data
  redis_data:
    name: ride-booking-redis-data

networks:
  ride-booking-network:
    name: ride-booking-network
    driver: bridge
